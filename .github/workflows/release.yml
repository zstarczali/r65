# Publishes a GitHub release. It only runs when started by hand.
# It checks the tag against the version in Cargo.toml, builds every package with
# build.yml, then creates the tag on the commit that was built and the release
# with the packages and a SHA256SUMS file.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create, such as v1.0.0. Empty means v + the version in Cargo.toml."
        required: false
        default: ""
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false
      draft:
        description: "Create as a draft, publish it later by hand"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check version and tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Work out the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          TAG="${INPUT_TAG:-v$VERSION}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG doesn't match version $VERSION in Cargo.toml. Bump the version first."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            TAG_SHA="$(git ls-remote --tags origin "refs/tags/$TAG^{}" | cut -f1)"
            [ -n "$TAG_SHA" ] || TAG_SHA="$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)"
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG already exists on another commit ($TAG_SHA)."
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG from $GITHUB_REF_NAME ($GITHUB_SHA)"

  build:
    name: Build
    needs: prepare
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          FLAGS=()
          [ "$PRERELEASE" = "true" ] && FLAGS+=(--prerelease)
          [ "$DRAFT" = "true" ] && FLAGS+=(--draft)
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "R65 $TAG" \
            --generate-notes \
            "${FLAGS[@]}"
