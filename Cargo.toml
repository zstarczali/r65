[package]
name = "rust65"
version = "1.0.0"
edition = "2024"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png"] }
rfd = "0.15"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1
